plugins {
    id 'com.android.application'
}

android {
    namespace 'com.semime.nasepub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.semime.nasepub'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.hierynomus:smbj:0.15.0'
}
