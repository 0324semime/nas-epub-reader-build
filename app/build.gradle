plugins {
    id 'com.android.application'
}
android {
    namespace 'com.semime.nasepub'
    compileSdk 35
    defaultConfig {
        applicationId 'com.semime.nasepub.thor'
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName '0.5.7-thor-alpha8'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.hierynomus:smbj:0.15.0'
    implementation files('libs/tsbridge.aar')
}
