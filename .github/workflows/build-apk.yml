name: Build Android APK (embedded Tailscale)
on:
  push:
    branches: [main, 'feature/thor-dual-screen']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Build tsnet Android arm64 AAR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOTOOLCHAIN: 'auto'
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install Android NDK and SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Unit tests and generate Android bridge
        shell: bash
        run: |
          set -euxo pipefail
          cd go
          go mod download
          go test ./tsbridge
          mkdir -p "$RUNNER_TEMP/tsnet-bin"
          go build -o "$RUNNER_TEMP/tsnet-bin/gomobile" golang.org/x/mobile/cmd/gomobile
          go build -o "$RUNNER_TEMP/tsnet-bin/gobind" golang.org/x/mobile/cmd/gobind
          export PATH="$RUNNER_TEMP/tsnet-bin:$PATH"
          gomobile init
          gomobile bind -target=android/arm64 -androidapi=26 -javapkg=org.semime -o "$GITHUB_WORKSPACE/tsbridge.aar" ./tsbridge
          test -s "$GITHUB_WORKSPACE/tsbridge.aar"
          unzip -l "$GITHUB_WORKSPACE/tsbridge.aar" | grep -E 'jni/arm64-v8a/libgojni.so'
      - uses: actions/upload-artifact@v4
        with:
          name: tsbridge-aar
          path: tsbridge.aar
          retention-days: 7
  android:
    name: Build EPUB Reader APK
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download native bridge
        uses: actions/download-artifact@v4
        with:
          name: tsbridge-aar
          path: app/libs
      - name: Verify native AAR
        run: |
          test -s app/libs/tsbridge.aar
          unzip -l app/libs/tsbridge.aar | grep -E 'classes.jar|libgojni.so'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NAS-EPUB-Reader-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
